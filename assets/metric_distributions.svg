<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Distribution of the three Erdős-adjacency metrics</title>
<desc>Three histograms, equal-width bins, score on the horizontal axis and number of people on a logarithmic vertical axis. Collaboration M2 puts 10,820 of 14,282 people in the single bin at score 1. Problem-solving M5 has no comparable spike but only 1,140 people score at all. The combined metric M4-prime inherits M2's pile-up.</desc>
